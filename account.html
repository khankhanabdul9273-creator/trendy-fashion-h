<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account — MODERN DRESS WEAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans antialiased">

    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-200">

            <div class="flex items-center justify-between gap-3 mb-5">
                <a href="index.html" class="text-sm font-medium text-gray-600 hover:text-black">← Back to store</a>
                <button id="logout-btn" type="button" class="text-sm font-semibold text-red-600 hover:underline">
                    Sign Out
                </button>
            </div>

            <!-- TABS: LOGIN / SIGNUP -->
            <div class="flex border-b border-gray-200 mb-6">
                <button id="tab-login" class="flex-1 py-3 text-center font-semibold border-b-2 border-black text-black">
                    Login
                </button>
                <button id="tab-signup" class="flex-1 py-3 text-center font-semibold border-b-2 border-transparent text-gray-500">
                    Sign Up
                </button>
            </div>

            <!-- LOGIN FORM -->
            <div id="login-form-container">
                <h1 class="text-2xl font-bold text-center mb-6">Welcome Back</h1>
                <form id="login-password-form" class="space-y-4">
                    <label for="login-password-email" class="block text-sm font-medium">Gmail / Email</label>
                    <input type="email" id="login-password-email" autocomplete="email" placeholder="Gmail / Email" required class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                    <label for="login-password-value" class="block text-sm font-medium">Password</label>
                    <input type="password" id="login-password-value" autocomplete="current-password" placeholder="Password" required class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                    <button type="submit" class="w-full py-3 bg-black text-white rounded-lg font-semibold hover:bg-gray-800">Login</button>
                </form>
                <p id="login-error" role="alert" class="text-red-500 text-sm mt-3 text-center hidden"></p>
                <p id="login-success" role="status" class="text-green-600 text-sm mt-3 text-center hidden"></p>
            </div>

            <!-- SIGNUP FORM -->
            <div id="signup-form-container" class="hidden">
                <h1 class="text-2xl font-bold text-center mb-6">Create Account</h1>
                <form id="signup-password-form" class="space-y-4">
                    <label for="signup-password-email" class="block text-sm font-medium">Gmail / Email</label>
                    <input type="email" id="signup-password-email" autocomplete="email" placeholder="Gmail / Email" required class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                    <label for="signup-password-value" class="block text-sm font-medium">Password</label>
                    <input type="password" id="signup-password-value" autocomplete="new-password" minlength="8" placeholder="Password (at least 8 characters)" required class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                    <button type="submit" class="w-full py-3 bg-black text-white rounded-lg font-semibold hover:bg-gray-800">Create Account</button>
                </form>
                <p id="signup-error" role="alert" class="text-red-500 text-sm mt-3 text-center hidden"></p>
                <p id="signup-success" role="status" class="text-green-600 text-sm mt-3 text-center hidden"></p>
            </div>

            <!-- LOGGED-IN DASHBOARD -->
            <div id="dashboard" class="hidden">
                <h1 class="text-2xl font-bold mb-6">My Account</h1>
                <div class="space-y-4">
                    <p id="dashboard-error" role="alert" class="hidden text-sm text-red-600"></p>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <p class="text-xs text-gray-500 uppercase">Name</p>
                        <p id="user-name" class="font-semibold"></p>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <p class="text-xs text-gray-500 uppercase">Email</p>
                        <p id="user-email" class="font-semibold"></p>
                    </div>
                    <div class="bg-gray-50 p-4 rounded-lg">
                        <p class="text-xs text-gray-500 uppercase">Phone</p>
                        <p id="user-phone" class="font-semibold"></p>
                    </div>
                    <section class="pt-2" aria-labelledby="my-orders-heading">
                        <div class="flex items-center justify-between gap-3 mb-3">
                            <div>
                                <h2 id="my-orders-heading" class="text-xl font-bold">My Orders</h2>
                                <p class="text-xs text-gray-500 mt-1">Products ordered with this verified mobile number.</p>
                            </div>
                            <button id="refresh-orders-btn" type="button" class="text-xs font-semibold underline">Refresh</button>
                        </div>
                        <div id="customer-orders" class="space-y-3" aria-live="polite">
                            <p class="text-sm text-gray-500">Loading your orders...</p>
                        </div>
                    </section>
                    <a href="index.html" class="block text-center py-3 bg-black text-white rounded-lg font-semibold hover:bg-gray-800">Continue Shopping</a>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ============================================
        // SUPABASE CONFIG
        // ============================================
        const SUPABASE_URL = 'https://fpxqhvyxecjlrujdnqew.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gp2idPt3RKuPnHBJZW3rrQ_grPn8T9e';

        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const loginContainer = document.getElementById('login-form-container');
        const signupContainer = document.getElementById('signup-form-container');
        function normalizePhoneNumber(value) {
            const digits = String(value || '').replace(/\D/g, '');
            return digits.length > 10 ? digits.slice(-10) : digits;
        }

        function getOrdersForPhone(phone) {
            const storedOrders = localStorage.getItem('av_orders');
            if (!storedOrders) return [];
            let orders;
            try {
                orders = JSON.parse(storedOrders);
            } catch (error) {
                console.error('Could not read saved orders:', error);
                return [];
            }
            if (!Array.isArray(orders)) {
                console.error('Saved order data is not a list.');
                return [];
            }
            const normalizedPhone = normalizePhoneNumber(phone);
            if (normalizedPhone.length < 7) return [];
            return orders.filter(order =>
                normalizePhoneNumber(order.phone) === normalizedPhone
            );
        }

        function renderCustomerOrders(phone) {
            const container = document.getElementById('customer-orders');
            const orders = getOrdersForPhone(phone);
            container.replaceChildren();
            if (!orders.length) {
                const empty = document.createElement('p');
                empty.className = 'rounded-lg bg-gray-50 p-4 text-sm text-gray-600';
                empty.textContent = 'No orders found for this mobile number in this browser yet.';
                container.append(empty);
                return;
            }

            orders.forEach(order => {
                const card = document.createElement('article');
                card.className = 'rounded-xl border border-gray-200 p-4 space-y-3';
                const heading = document.createElement('div');
                heading.className = 'flex flex-wrap items-start justify-between gap-2';
                const details = document.createElement('div');
                const orderId = document.createElement('h3');
                orderId.className = 'font-semibold';
                orderId.textContent = `Order #${order.id || 'N/A'}`;
                const orderDate = document.createElement('p');
                orderDate.className = 'text-xs text-gray-500 mt-1';
                const date = order.createdAt ? new Date(order.createdAt) : null;
                orderDate.textContent = date && !Number.isNaN(date.getTime())
                    ? `Placed ${new Intl.DateTimeFormat('en-IN', { dateStyle: 'medium', timeStyle: 'short' }).format(date)}`
                    : 'Purchase date unavailable';
                details.append(orderId, orderDate);
                const status = document.createElement('span');
                status.className = 'rounded-full bg-gray-100 px-3 py-1 text-xs font-medium';
                status.textContent = order.status || 'Order placed';
                heading.append(details, status);
                card.append(heading);

                const items = Array.isArray(order.items) && order.items.length
                    ? order.items
                    : (Array.isArray(order.productIds)
                        ? order.productIds.map(id => ({ id, title: 'Product details unavailable' }))
                        : []);
                const list = document.createElement('ul');
                list.className = 'space-y-2 border-t border-gray-100 pt-3';
                items.forEach(item => {
                    const row = document.createElement('li');
                    row.className = 'flex items-center gap-3';
                    const imageUrl = String(item.img || '');
                    if (/^(https?:\/\/|data:image\/)/i.test(imageUrl)) {
                        const image = document.createElement('img');
                        image.src = imageUrl;
                        image.alt = item.title || 'Ordered product';
                        image.className = 'h-16 w-12 rounded object-cover bg-gray-100';
                        row.append(image);
                    }
                    const productDetails = document.createElement('div');
                    productDetails.className = 'min-w-0 flex-1';
                    const title = document.createElement('p');
                    title.className = 'text-sm font-medium';
                    title.textContent = item.title || 'Product details unavailable';
                    const options = [
                        item.selectedSize && `Size: ${item.selectedSize}`,
                        item.selectedColor && `Color: ${item.selectedColor}`
                    ].filter(Boolean).join(' · ');
                    const quantity = Number(item.qty) || 1;
                    const price = Number(item.price);
                    const meta = document.createElement('p');
                    meta.className = 'text-xs text-gray-500 mt-1';
                    meta.textContent = `${options ? `${options} · ` : ''}Qty: ${quantity}${Number.isFinite(price) ? ` · ₹${price.toLocaleString('en-IN')}` : ''}`;
                    productDetails.append(title, meta);
                    row.append(productDetails);
                    list.append(row);
                });
                if (items.length) card.append(list);

                const total = document.createElement('p');
                total.className = 'border-t border-gray-100 pt-3 text-right text-sm font-semibold';
                const totalAmount = Number(order.total);
                total.textContent = `Order total: ${Number.isFinite(totalAmount) ? `₹${totalAmount.toLocaleString('en-IN')}` : 'Unavailable'}`;
                card.append(total);
                container.append(card);
            });
        }

        document.getElementById('refresh-orders-btn').addEventListener('click', () => {
            renderCustomerOrders(document.getElementById('user-phone').dataset.phone);
        });

        window.addEventListener('storage', event => {
            if (event.key === 'av_orders') {
                renderCustomerOrders(document.getElementById('user-phone').dataset.phone);
            }
        });

        function switchTab(mode) {
            const showLogin = mode === 'login';
            loginContainer.classList.remove('hidden');
            signupContainer.classList.toggle('hidden', showLogin);
            loginContainer.classList.toggle('hidden', !showLogin);
            tabLogin.classList.toggle('border-black', showLogin);
            tabLogin.classList.toggle('text-black', showLogin);
            tabLogin.classList.toggle('border-transparent', !showLogin);
            tabLogin.classList.toggle('text-gray-500', !showLogin);
            tabSignup.classList.toggle('border-black', !showLogin);
            tabSignup.classList.toggle('text-black', !showLogin);
            tabSignup.classList.toggle('border-transparent', showLogin);
            tabSignup.classList.toggle('text-gray-500', showLogin);
        }

        tabLogin.addEventListener('click', () => switchTab('login'));
        tabSignup.addEventListener('click', () => switchTab('signup'));

        document.getElementById('login-password-form').addEventListener('submit', async event => {
            event.preventDefault();
            setMessage('login', '', '');
            const button = event.currentTarget.querySelector('button[type="submit"]');
            button.disabled = true;
            button.textContent = 'Logging in...';
            try {
                const { data, error } = await sb.auth.signInWithPassword({
                    email: document.getElementById('login-password-email').value.trim(),
                    password: document.getElementById('login-password-value').value
                });
                if (error) throw error;
                await showDashboard(data.user);
            } catch (error) {
                console.error('Could not log in with email and password:', error);
                setMessage('login', 'error', error.message || 'Login failed. Please try again.');
            } finally {
                button.disabled = false;
                button.textContent = 'Login';
            }
        });

        document.getElementById('signup-password-form').addEventListener('submit', async event => {
            event.preventDefault();
            setMessage('signup', '', '');
            const button = event.currentTarget.querySelector('button[type="submit"]');
            button.disabled = true;
            button.textContent = 'Creating account...';
            try {
                const { data, error } = await sb.auth.signUp({
                    email: document.getElementById('signup-password-email').value.trim(),
                    password: document.getElementById('signup-password-value').value,
                    options: {
                        emailRedirectTo: `${location.origin}${location.pathname}`
                    }
                });
                if (error) throw error;
                if (data.session) {
                    await showDashboard(data.user);
                } else {
                    setMessage('signup', 'success', 'Account created. Check your email to confirm your address, then log in.');
                }
            } catch (error) {
                console.error('Could not create an email account:', error);
                setMessage('signup', 'error', error.message || 'Account creation failed. Please try again.');
            } finally {
                button.disabled = false;
                button.textContent = 'Create Account';
            }
        });

        function setMessage(mode, type, message) {
            const error = document.getElementById(`${mode}-error`);
            const success = document.getElementById(`${mode}-success`);
            error.classList.add('hidden');
            success.classList.add('hidden');
            if (!message) return;
            const target = type === 'error' ? error : success;
            target.textContent = message;
            target.classList.remove('hidden');
        }

        document.getElementById('logout-btn').addEventListener('click', async () => {
            const { error } = await sb.auth.signOut();
            if (error) {
                const dashboardError = document.getElementById('dashboard-error');
                dashboardError.textContent = error.message;
                dashboardError.classList.remove('hidden');
                return;
            }
            location.reload();
        });

        async function showDashboard(user) {
            document.getElementById('login-form-container').classList.add('hidden');
            document.getElementById('signup-form-container').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.querySelector('.flex.border-b').classList.add('hidden');

            const dashboardError = document.getElementById('dashboard-error');
            dashboardError.classList.add('hidden');
            const { data, error } = await sb.from('customers').select('*').eq('id', user.id).maybeSingle();
            if (error) {
                dashboardError.textContent = `Could not load account details: ${error.message}`;
                dashboardError.classList.remove('hidden');
            }
            const name = data?.full_name || user.user_metadata?.full_name || user.email?.split('@')[0] || '';
            document.getElementById('user-name').textContent = name;
            document.getElementById('user-email').textContent = data?.email || user.email || 'N/A';
            const phone = data?.phone || user.phone || '';
            const phoneElement = document.getElementById('user-phone');
            phoneElement.textContent = phone || 'N/A';
            phoneElement.dataset.phone = phone;
            renderCustomerOrders(phone);
        }

        (async () => {
            const { data, error } = await sb.auth.getSession();
            if (error) {
                document.getElementById('login-error').textContent = error.message;
                document.getElementById('login-error').classList.remove('hidden');
                return;
            }
            if (data.session) await showDashboard(data.session.user);
        })();
    </script>
</body>
</html>
