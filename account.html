<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — MODERN DRESS WEAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 font-sans antialiased">

    <main class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-xl w-full max-w-3xl border border-gray-200">

            <div class="flex items-center justify-between gap-3 mb-5">
                <a href="index.html" class="text-sm font-medium text-gray-600 hover:text-black">← Back to store</a>
                <button id="logout-btn" type="button" class="text-sm font-semibold text-red-600 hover:underline">
                    Sign Out
                </button>
            </div>

            <p id="auth-check-message" role="status" class="py-12 text-center text-sm text-gray-600">Checking your sign-in...</p>

            <!-- PROFILE PAGE -->
            <div id="dashboard" class="hidden">
                <div class="mb-6 border-b border-gray-200 pb-5">
                    <p class="text-sm font-semibold uppercase tracking-wider text-gray-500">Account</p>
                    <h1 class="mt-1 text-3xl font-bold">My Profile</h1>
                    <p class="mt-2 text-sm text-gray-600">Your account information and order history.</p>
                </div>
                <p id="dashboard-error" role="alert" class="hidden mb-4 text-sm text-red-600"></p>
                <section class="rounded-2xl border border-gray-200 p-5 sm:p-6" aria-labelledby="profile-details-heading">
                    <div class="flex items-center gap-4 border-b border-gray-100 pb-5">
                        <div id="profile-avatar" aria-hidden="true" class="flex h-14 w-14 shrink-0 items-center justify-center rounded-full bg-gray-900 text-xl font-bold uppercase text-white"></div>
                        <div class="min-w-0">
                            <h2 id="profile-details-heading" class="text-xl font-bold">Profile details</h2>
                            <p id="profile-summary-email" class="mt-1 break-all text-sm text-gray-600"></p>
                        </div>
                    </div>
                    <dl class="mt-5 grid gap-4 sm:grid-cols-2">
                        <div class="rounded-xl bg-gray-50 p-4">
                            <dt class="text-xs font-semibold uppercase tracking-wide text-gray-500">Full name</dt>
                            <dd id="user-name" class="mt-1 break-words font-semibold text-gray-900"></dd>
                        </div>
                        <div class="rounded-xl bg-gray-50 p-4">
                            <dt class="text-xs font-semibold uppercase tracking-wide text-gray-500">Email address</dt>
                            <dd id="user-email" class="mt-1 break-all font-semibold text-gray-900"></dd>
                        </div>
                        <div class="rounded-xl bg-gray-50 p-4 sm:col-span-2">
                            <dt class="text-xs font-semibold uppercase tracking-wide text-gray-500">Phone number</dt>
                            <dd id="user-phone" class="mt-1 font-semibold text-gray-900"></dd>
                        </div>
                    </dl>
                </section>
                <div class="mt-8 space-y-4">
                    <section class="pt-2" aria-labelledby="my-orders-heading">
                        <div class="flex items-center justify-between gap-3 mb-3">
                            <div>
                                <h2 id="my-orders-heading" class="text-xl font-bold">My Orders</h2>
                                <p class="text-xs text-gray-500 mt-1">Orders linked to your signed-in account.</p>
                            </div>
                            <button id="refresh-orders-btn" type="button" class="text-xs font-semibold underline">Refresh</button>
                        </div>
                        <div id="customer-orders" class="space-y-3" aria-live="polite">
                            <p class="text-sm text-gray-500">Loading your orders...</p>
                        </div>
                    </section>
                    <a href="index.html" class="block text-center py-3 bg-black text-white rounded-lg font-semibold hover:bg-gray-800">Continue Shopping</a>
                </div>
            </div>

        </div>
    </main>

    <script>
        // ============================================
        // SUPABASE CONFIG
        // ============================================
        const SUPABASE_URL = 'https://fpxqhvyxecjlrujdnqew.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gp2idPt3RKuPnHBJZW3rrQ_grPn8T9e';

        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUserId = null;

        function renderCustomerOrders(orders) {
            const container = document.getElementById('customer-orders');
            container.replaceChildren();
            if (!orders.length) {
                const empty = document.createElement('p');
                empty.className = 'rounded-lg bg-gray-50 p-4 text-sm text-gray-600';
                empty.textContent = 'No orders found.';
                container.append(empty);
                return;
            }

            orders.forEach(order => {
                const card = document.createElement('article');
                card.className = 'rounded-xl border border-gray-200 p-4 space-y-3';
                const heading = document.createElement('div');
                heading.className = 'flex flex-wrap items-start justify-between gap-2';
                const details = document.createElement('div');
                const orderId = document.createElement('h3');
                orderId.className = 'font-semibold';
                orderId.textContent = `Order #${order.id || 'N/A'}`;
                const orderDate = document.createElement('p');
                orderDate.className = 'text-xs text-gray-500 mt-1';
                const dateValue = order.created_at || order.createdAt;
                const date = dateValue ? new Date(dateValue) : null;
                orderDate.textContent = date && !Number.isNaN(date.getTime())
                    ? `Placed ${new Intl.DateTimeFormat('en-IN', { dateStyle: 'medium', timeStyle: 'short' }).format(date)}`
                    : 'Purchase date unavailable';
                details.append(orderId, orderDate);
                const status = document.createElement('span');
                status.className = 'rounded-full bg-gray-100 px-3 py-1 text-xs font-medium';
                status.textContent = order.status || 'Order placed';
                heading.append(details, status);
                card.append(heading);

                const items = Array.isArray(order.items) && order.items.length
                    ? order.items
                    : (Array.isArray(order.productIds)
                        ? order.productIds.map(id => ({ id, title: 'Product details unavailable' }))
                        : (order.product_name
                            ? [{ title: order.product_name }]
                            : []));
                const list = document.createElement('ul');
                list.className = 'space-y-2 border-t border-gray-100 pt-3';
                items.forEach(item => {
                    const row = document.createElement('li');
                    row.className = 'flex items-center gap-3';
                    const imageUrl = String(item.img || '');
                    if (/^(https?:\/\/|data:image\/)/i.test(imageUrl)) {
                        const image = document.createElement('img');
                        image.src = imageUrl;
                        image.alt = item.title || 'Ordered product';
                        image.className = 'h-16 w-12 rounded object-cover bg-gray-100';
                        row.append(image);
                    }
                    const productDetails = document.createElement('div');
                    productDetails.className = 'min-w-0 flex-1';
                    const title = document.createElement('p');
                    title.className = 'text-sm font-medium';
                    title.textContent = item.title || 'Product details unavailable';
                    const options = [
                        item.selectedSize && `Size: ${item.selectedSize}`,
                        item.selectedColor && `Color: ${item.selectedColor}`
                    ].filter(Boolean).join(' · ');
                    const quantity = Number(item.qty) || 1;
                    const price = Number(item.price);
                    const meta = document.createElement('p');
                    meta.className = 'text-xs text-gray-500 mt-1';
                    meta.textContent = `${options ? `${options} · ` : ''}Qty: ${quantity}${Number.isFinite(price) ? ` · ₹${price.toLocaleString('en-IN')}` : ''}`;
                    productDetails.append(title, meta);
                    row.append(productDetails);
                    list.append(row);
                });
                if (items.length) card.append(list);

                if (order.total !== undefined && order.total !== null) {
                    const total = document.createElement('p');
                    total.className = 'border-t border-gray-100 pt-3 text-right text-sm font-semibold';
                    const totalAmount = Number(order.total);
                    total.textContent = `Order total: ${Number.isFinite(totalAmount) ? `₹${totalAmount.toLocaleString('en-IN')}` : 'Unavailable'}`;
                    card.append(total);
                }
                container.append(card);
            });
        }

        async function loadCustomerOrders(userId) {
            const container = document.getElementById('customer-orders');
            container.textContent = 'Loading your orders...';
            const { data: orders, error } = await sb
                .from('orders')
                .select('*')
                .eq('user_id', userId);
            if (error) throw error;
            renderCustomerOrders(orders || []);
        }

        document.getElementById('refresh-orders-btn').addEventListener('click', async event => {
            const button = event.currentTarget;
            if (!currentUserId) return;
            button.disabled = true;
            try {
                await loadCustomerOrders(currentUserId);
            } catch (error) {
                console.error('Could not refresh customer orders:', error);
                const container = document.getElementById('customer-orders');
                container.textContent = `Could not load orders: ${error.message || 'Please try again.'}`;
            } finally {
                button.disabled = false;
            }
        });

        document.getElementById('logout-btn').addEventListener('click', async event => {
            const button = event.currentTarget;
            button.disabled = true;
            button.textContent = 'Signing out...';
            try {
                const { error } = await sb.auth.signOut();
                if (error) throw error;
                window.location.replace('index.html');
            } catch (error) {
                console.error('Could not sign out:', error);
                const dashboardError = document.getElementById('dashboard-error');
                dashboardError.textContent = error.message || 'Could not sign out. Please try again.';
                dashboardError.classList.remove('hidden');
                button.disabled = false;
                button.textContent = 'Sign Out';
            }
        });

        async function showDashboard(user) {
            currentUserId = user.id;
            document.getElementById('auth-check-message').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');

            const dashboardError = document.getElementById('dashboard-error');
            dashboardError.classList.add('hidden');
            const { data, error } = await sb.from('customers').select('*').eq('id', user.id).maybeSingle();
            if (error) {
                dashboardError.textContent = `Could not load account details: ${error.message}`;
                dashboardError.classList.remove('hidden');
            }
            const name = data?.full_name || user.user_metadata?.full_name || user.user_metadata?.name || user.email?.split('@')[0] || '';
            document.getElementById('profile-avatar').textContent = name.charAt(0) || '?';
            document.getElementById('profile-summary-email').textContent = user.email || 'Email unavailable';
            document.getElementById('user-name').textContent = name;
            document.getElementById('user-email').textContent = data?.email || user.email || 'N/A';
            const phone = data?.phone || user.phone || '';
            const phoneElement = document.getElementById('user-phone');
            phoneElement.textContent = phone || 'N/A';
            phoneElement.dataset.phone = phone;
            try {
                await loadCustomerOrders(user.id);
            } catch (ordersError) {
                console.error('Could not load customer orders:', ordersError);
                const container = document.getElementById('customer-orders');
                container.textContent = `Could not load orders: ${ordersError.message || 'Please try again.'}`;
            }
        }

        sb.auth.onAuthStateChange((event, session) => {
            if (event === 'SIGNED_OUT' || !session) {
                window.location.replace('index.html?auth=required');
            }
        });

        (async () => {
            let data;
            let error;
            try {
                ({ data, error } = await sb.auth.getUser());
            } catch (sessionError) {
                error = sessionError;
            }
            if (error) {
                console.error('Could not verify the customer session:', error);
                window.location.replace('index.html?auth=required&authError=1');
                return;
            }
            if (!data.user) {
                window.location.replace('index.html?auth=required');
                return;
            }
            await showDashboard(data.user);
        })();
    </script>
</body>
</html>
