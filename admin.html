<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — MODERN DRESS WEAR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">

    <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-200">
            <h1 class="text-2xl font-bold text-center mb-6">Admin Panel</h1>
            <form id="login-form" class="space-y-4">
                <input type="email" id="login-email" placeholder="Email" required class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                <input type="password" id="login-password" placeholder="Password" required class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-black">
                <button type="submit" class="w-full py-3 bg-black text-white rounded-lg font-semibold hover:bg-gray-800">Login</button>
            </form>
            <p id="login-error" class="text-red-500 text-sm mt-3 text-center hidden"></p>
        </div>
    </div>

    <div id="admin-screen" class="hidden min-h-screen p-6">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-serif">Admin Dashboard</h1>
                <button id="logout-btn" class="px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600">Logout</button>
            </div>
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">Products</h2>
                    <button id="add-product-btn" class="px-4 py-2 bg-black text-white rounded-lg hover:bg-gray-800">+ Add New Product</button>
                </div>
                <div id="products-list" class="space-y-3">Loading...</div>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 w-full max-w-2xl max-h-[90vh] overflow-y-auto">
            <h3 id="modal-title" class="text-xl font-bold mb-4">Edit Product</h3>
            <form id="product-form" class="space-y-4">
                <input type="hidden" id="form-id">
                <input type="text" id="form-title" placeholder="Title" required class="w-full p-2 border rounded">
                <input type="number" id="form-price" placeholder="Price" required class="w-full p-2 border rounded">
                <input type="number" id="form-mrp" placeholder="MRP" class="w-full p-2 border rounded">
                <input type="number" id="form-stockleft" placeholder="Stock Left" class="w-full p-2 border rounded">
                <select id="form-category" class="w-full p-2 border rounded">
                    <option value="Top">Top</option>
                    <option value="Dresses">Dresses</option>
                    <option value="Bottom">Bottom</option>
                    <option value="Denim">Denim</option>
                    <option value="Winter 2026">Winter 2026</option>
                </select>
                <input type="text" id="form-img" placeholder="Image URL" required class="w-full p-2 border rounded">
                <label for="form-hoverimg" class="block text-sm font-medium">
                    Hover Image URL
                    <input type="url" id="form-hoverimg" placeholder="Optional image URL shown when hovering over the product" class="mt-1 w-full p-2 border rounded">
                    <span class="mt-1 block text-xs font-normal text-gray-500">Leave blank to use the main product image.</span>
                </label>
                <textarea id="form-gallery-images" placeholder="Additional gallery photo URLs (up to 3, one per line)" rows="3" class="w-full p-2 border rounded"></textarea>
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm font-medium">Product Colors</span>
                        <button type="button" id="add-color-option" class="px-3 py-1.5 rounded bg-gray-100 border text-sm hover:bg-gray-200">+ Add Color</button>
                    </div>
                    <div id="form-color-options" class="space-y-2"></div>
                    <p class="text-xs text-gray-500 mt-1">Choose any color with the picker; color name is optional.</p>
                </div>
                <textarea id="form-description" placeholder="Description" rows="3" class="w-full p-2 border rounded"></textarea>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 py-2 bg-black text-white rounded">Save</button>
                    <button type="button" id="cancel-edit" class="px-4 py-2 border rounded">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://fpxqhvyxecjlrujdnqew.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_gp2idPt3RKuPnHBJZW3rrQ_grPn8T9e';

        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function parseGalleryUrls(value) {
            return value.split(/\r?\n/).map(url => url.trim()).filter(Boolean);
        }

        function addAdminColorRow(color = {}) {
            const container = document.getElementById('form-color-options');
            const row = document.createElement('div');
            row.className = 'flex items-center gap-2';
            const picker = document.createElement('input');
            picker.type = 'color';
            picker.value = /^#[0-9a-f]{6}$/i.test(color.hex || '') ? color.hex : '#000000';
            picker.className = 'h-10 w-12 p-1 border rounded cursor-pointer';
            picker.setAttribute('aria-label', 'Choose product color');
            const name = document.createElement('input');
            name.type = 'text';
            name.value = color.name || '';
            name.placeholder = 'Color name (optional)';
            name.maxLength = 40;
            name.className = 'min-w-0 flex-1 p-2 border rounded';
            const remove = document.createElement('button');
            remove.type = 'button';
            remove.textContent = 'Remove';
            remove.className = 'px-3 py-2 text-sm text-red-600 hover:underline';
            remove.onclick = () => row.remove();
            row.append(picker, name, remove);
            container.append(row);
        }

        function getAdminColorOptions() {
            return [...document.querySelectorAll('#form-color-options > div')].map(row => {
                const hex = row.querySelector('input[type="color"]').value;
                const name = row.querySelector('input[type="text"]').value.trim() || hex;
                return { name, hex };
            });
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');

            const { error } = await sb.auth.signInWithPassword({ email, password });
            if (error) {
                errorEl.textContent = error.message;
                errorEl.classList.remove('hidden');
                return;
            }
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-screen').classList.remove('hidden');
            loadProducts();
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await sb.auth.signOut();
            location.reload();
        });

        async function loadProducts() {
            const { data, error } = await sb.from('products').select('*').order('id', { ascending: false });
            if (error) return alert(error.message);
            const list = document.getElementById('products-list');
            if (!data.length) {
                list.innerHTML = '<p class="text-gray-500">No products yet.</p>';
                return;
            }
            list.innerHTML = data.map(p => `
                <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                    <div>
                        <p class="font-bold">${p.title}</p>
                        <p class="text-sm text-gray-500">₹${p.price} | Stock: ${p.stockleft}</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="editProduct(${p.id})" class="px-3 py-1 bg-blue-500 text-white rounded text-sm">Edit</button>
                        <button onclick="deleteProduct(${p.id})" class="px-3 py-1 bg-red-500 text-white rounded text-sm">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('add-product-btn').addEventListener('click', () => {
            document.getElementById('modal-title').textContent = 'Add New Product';
            document.getElementById('product-form').reset();
            document.getElementById('form-id').value = '';
            document.getElementById('form-color-options').replaceChildren();
            document.getElementById('edit-modal').classList.remove('hidden');
        });

        document.getElementById('add-color-option').addEventListener('click', () => addAdminColorRow());

        async function editProduct(id) {
            const { data, error } = await sb.from('products').select('*').eq('id', id).single();
            if (error) return alert(error.message);
            document.getElementById('modal-title').textContent = 'Edit Product';
            document.getElementById('form-id').value = data.id;
            document.getElementById('form-title').value = data.title || '';
            document.getElementById('form-price').value = data.price || '';
            document.getElementById('form-mrp').value = data.mrp || '';
            document.getElementById('form-stockleft').value = data.stockleft || '';
            document.getElementById('form-img').value = data.img || '';
            document.getElementById('form-hoverimg').value = data.hoverimg || '';
            document.getElementById('form-category').value = data.category || 'Dresses';
            document.getElementById('form-gallery-images').value = Array.isArray(data.gallery_images) ? data.gallery_images.join('\n') : '';
            document.getElementById('form-color-options').replaceChildren();
            (Array.isArray(data.color_options) ? data.color_options : []).forEach(addAdminColorRow);
            document.getElementById('form-description').value = data.description || '';
            document.getElementById('edit-modal').classList.remove('hidden');
        }

        async function deleteProduct(id) {
            if (!confirm('Pakka delete karna hai?')) return;
            const { error } = await sb.from('products').delete().eq('id', id);
            if (error) return alert(error.message);
            loadProducts();
        }

        document.getElementById('product-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('form-id').value;
            const galleryImages = parseGalleryUrls(document.getElementById('form-gallery-images').value);
            if (galleryImages.length > 3) {
                alert('Add no more than 3 extra photos (4 photos total including the main photo).');
                return;
            }
            const colorOptions = getAdminColorOptions();
            const product = {
                title: document.getElementById('form-title').value,
                price: Number(document.getElementById('form-price').value),
                mrp: Number(document.getElementById('form-mrp').value) || 0,
                stockleft: Number(document.getElementById('form-stockleft').value) || 0,
                img: document.getElementById('form-img').value,
                hoverimg: document.getElementById('form-hoverimg').value.trim(),
                gallery_images: galleryImages,
                color_options: colorOptions,
                description: document.getElementById('form-description').value,
                category: document.getElementById('form-category').value,
                occasion: 'Casual',
                tag: 'New'
            };
            let result;
            if (id) {
                result = await sb.from('products').update(product).eq('id', id);
            } else {
                result = await sb.from('products').insert(product);
            }
            if (result.error) return alert(result.error.message);
            document.getElementById('edit-modal').classList.add('hidden');
            loadProducts();
        });

        document.getElementById('cancel-edit').addEventListener('click', () => {
            document.getElementById('edit-modal').classList.add('hidden');
        });

        sb.auth.getSession().then(({ data }) => {
            if (data.session) {
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('admin-screen').classList.remove('hidden');
                loadProducts();
            }
        });
    </script>
</body>
</html>
